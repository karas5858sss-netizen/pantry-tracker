name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    name: Typecheck, Test and Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Typecheck (tsc --noEmit)
        run: npm run check

      - name: Run Unit Tests
        run: npm test

      - name: Build frontend bundle
        run: npm run build

  db-smoke:
    name: Database RLS Smoke Test (Local Supabase)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Start Supabase
        run: supabase start

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run DB RLS Smoke Test against Local Supabase
        run: |
          STATUS_JSON=$(supabase status -o json)
          export SUPABASE_URL=$(echo "$STATUS_JSON" | jq -r '.API_URL')
          export SUPABASE_ANON_KEY=$(echo "$STATUS_JSON" | jq -r '.ANON_KEY')
          echo "Running RLS smoke test against local Supabase at $SUPABASE_URL"
          npm run test:smoke

      - name: Stop Supabase
        if: always()
        run: supabase stop
